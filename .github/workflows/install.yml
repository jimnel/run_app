name: Install

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install project
        run: uv sync --locked

      - name: Smoke test
        run: printf 'half\n1 30\n' | uv run run.py
